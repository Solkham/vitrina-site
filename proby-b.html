<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проба Б — богатый 3D</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Проба Б: живой 3D — фото-текстуры мрамора, HDRI-свет, отражающий пол, свечение ламп */
:root{--display:"Tenor Sans",Georgia,serif;--body:"Golos Text",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f3e8e4;font-family:var(--body);color:#2a1e1f;overflow:hidden}
[hidden]{display:none!important}
canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:16px clamp(16px,4vw,40px);z-index:2;pointer-events:none}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.06em}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7f6a66}
.note{position:fixed;left:16px;bottom:16px;z-index:2;max-width:min(380px,calc(100% - 32px));font-size:12px;line-height:1.45;background:rgba(255,250,247,.85);backdrop-filter:blur(6px);padding:10px 12px;border-radius:10px}
.load{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7f6a66;z-index:3;background:#f3e8e4}
.fps{position:fixed;right:12px;bottom:12px;z-index:2;font-size:11px;font-variant-numeric:tabular-nums;color:#7f6a66;background:rgba(255,250,247,.8);padding:4px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="load" id="load">Загружаю зал…</div>
<header class="top"><div class="brand">Витрина<small>Женский зал · проба Б</small></div></header>
<div class="note">Проба Б: настоящий 3D в реальном времени. Мрамор и свет — бесплатные фото-ресурсы Poly Haven, пол отражает, лампы светятся, вещи — фото. Двигай мышью или пальцем — камера живая. Справа внизу — кадры в секунду: ниже 30 на телефоне = будет тормозить.</div>
<div class="fps" id="fps"></div>
<script type="module" src="/src/proby-b.js"></script>
</body>
</html>
