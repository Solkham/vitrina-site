<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проба В — каталки 3D</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Проба В: три настоящие 3D-каталки в одной сцене, переключатель сверху */
:root{--display:"Tenor Sans",Georgia,serif;--body:"Golos Text",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f3e8e4;font-family:var(--body);color:#2a1e1f;overflow:hidden}
[hidden]{display:none!important}
canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:14px clamp(14px,4vw,40px);z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.06em}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7f6a66}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,250,247,.88);backdrop-filter:blur(6px);box-shadow:0 2px 14px rgba(80,40,40,.12);pointer-events:auto}
.tabs button{font:500 13px/1 var(--body);color:#5b4745;background:none;border:0;border-radius:999px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tabs button b{font-family:var(--display);font-weight:400;margin-right:6px;color:#a77d4a}
.tabs button[aria-pressed=true]{background:#2a1e1f;color:#fff6ee}
.tabs button[aria-pressed=true] b{color:#e3c392}
.note{position:fixed;left:14px;bottom:14px;z-index:2;max-width:min(380px,calc(100% - 110px));font-size:12px;line-height:1.45;background:rgba(255,250,247,.85);backdrop-filter:blur(6px);padding:10px 12px;border-radius:10px}
.load{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7f6a66;z-index:3;background:#f3e8e4}
.fps{position:fixed;right:12px;bottom:12px;z-index:2;font-size:11px;font-variant-numeric:tabular-nums;color:#7f6a66;background:rgba(255,250,247,.8);padding:4px 8px;border-radius:6px}
@media(max-width:640px){.top{flex-direction:column;align-items:stretch}.tabs{justify-content:space-between}.tabs button{flex:1;padding:10px 6px;font-size:12px}.tabs button b{margin-right:3px}}
</style>
</head>
<body>
<div class="load" id="load">Загружаю зал…</div>
<header class="top">
  <div class="brand">Витрина<small>Женский зал · проба В · каталки</small></div>
  <nav class="tabs" id="tabs" aria-label="Вариант каталки">
    <button data-v="a" aria-pressed="true"><b>А</b>Подвесная</button>
    <button data-v="b" aria-pressed="false"><b>Б</b>Мраморная</button>
    <button data-v="c" aria-pressed="false"><b>В</b>Витрина-куб</button>
  </nav>
</header>
<div class="note">Три настоящие 3D-каталки, меняется только она. Двигай мышью или пальцем — камера живая и медленно едет вперёд. Справа внизу — кадры в секунду; при &lt;30 качество снижается само.</div>
<div class="fps" id="fps"></div>
<script type="module" src="/src/proby-c.js"></script>
</body>
</html>
